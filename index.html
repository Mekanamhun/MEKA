<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101418">
<title>기능 구술 암기장</title>
<style>
:root{
  --bg:#101418; --panel:#181e25; --panel2:#1f2731; --line:#2b3540;
  --tx:#dce4ec; --dim:#8b98a5; --acc:#4fc3f7; --acc2:#ffb74d;
  --mark:#ffd54f; --star:#ff8a65; --ok:#81c784; --del:#e57373;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg); color:var(--tx); font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; font-size:15px; line-height:1.65;}
header{position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--line); padding:10px 14px;}
h1{font-size:17px; color:var(--acc); margin-bottom:8px;}
h1 small{color:var(--dim); font-weight:normal; font-size:12px; margin-left:8px;}
#q{width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--tx); font-size:15px; outline:none;}
#q:focus{border-color:var(--acc);}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.chip{padding:4px 11px; border-radius:14px; border:1px solid var(--line); background:var(--panel); color:var(--dim); font-size:12.5px; cursor:pointer; user-select:none;}
.chip.on{background:var(--acc); color:#06232f; border-color:var(--acc); font-weight:bold;}
#stat{color:var(--dim); font-size:12px; margin-top:6px;}
main{max-width:860px; margin:0 auto; padding:14px;}
.card{background:var(--panel); border:1px solid var(--line); border-radius:10px; margin-bottom:10px; overflow:hidden;}
.card.hide{display:none;}
.card.edited{border-left:3px solid var(--acc2);}
.hd{display:flex; align-items:baseline; gap:8px; padding:10px 14px; cursor:pointer;}
.hd:hover{background:var(--panel2);}
.no{color:var(--acc2); font-weight:bold; font-size:14px; white-space:nowrap;}
.tt{font-weight:bold; font-size:15px; flex:1;}
.tt .imp{color:var(--star); font-size:12px; margin-left:5px;}
.cat-tag{font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:10px; padding:1px 8px; white-space:nowrap;}
.bd{display:none; padding:4px 16px 14px 16px; border-top:1px solid var(--line);}
.card.open .bd{display:block;}
.bd ol{list-style:none; margin-top:6px;}
.bd ol li{padding-left:26px; position:relative; margin-bottom:3px;}
.bd ol li::before{content:attr(data-n); position:absolute; left:0; color:var(--acc); font-weight:bold;}
.ph{color:var(--acc2); font-weight:bold; margin-top:8px;}
.nt{color:var(--dim); font-size:13.5px; margin-top:8px; padding-left:10px; border-left:2px solid var(--line);}
mark{background:var(--mark); color:#222; border-radius:2px; padding:0 1px;}
.btns{display:flex; gap:8px; margin-top:8px;}
.btn{flex:1; text-align:center; padding:6px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--dim); font-size:12.5px; cursor:pointer;}
.btn:hover{color:var(--tx);}
.empty{text-align:center; color:var(--dim); padding:40px 0;}
footer{text-align:center; color:var(--dim); font-size:11.5px; padding:20px 0 calc(30px + env(safe-area-inset-bottom));}
@media (max-width:520px){
  .act{padding:8px 13px; font-size:13px;}
  .acts{flex-wrap:wrap; justify-content:flex-start;}
  .btn{padding:9px 4px;}
  .chip{padding:6px 13px;}
  .hd{padding:12px 12px;}
  #gear{width:40px; height:40px;}
  #menu .mi{padding:12px 14px;}
}
/* 카드 하단 액션 */
.acts{display:flex; gap:6px; margin-top:12px; justify-content:flex-end;}
.act{padding:4px 12px; border-radius:6px; border:1px solid var(--line); background:var(--panel2); color:var(--dim); font-size:12px; cursor:pointer;}
.act:hover{color:var(--tx);}
.act.danger:hover{color:var(--del); border-color:var(--del);}
/* 편집 폼 */
.ed{padding:12px 16px 16px; border-top:1px solid var(--line);}
.ed label{display:block; color:var(--dim); font-size:12px; margin:10px 0 3px;}
.ed input[type=text], .ed textarea{width:100%; padding:7px 10px; border-radius:7px; border:1px solid var(--line); background:var(--panel2); color:var(--tx); font-size:14px; font-family:inherit; outline:none;}
.ed input:focus, .ed textarea:focus{border-color:var(--acc);}
.ed textarea{resize:vertical; line-height:1.5;}
.ed .row{display:flex; gap:8px;}
.ed .row > div{flex:1;}
.ed .chk{display:flex; align-items:center; gap:6px; margin-top:10px; color:var(--dim); font-size:13px; cursor:pointer;}
.ed .save-row{display:flex; gap:8px; margin-top:14px;}
.ed .sbtn{flex:1; padding:8px; border-radius:8px; border:none; font-size:14px; font-weight:bold; cursor:pointer;}
.ed .sbtn.save{background:var(--acc); color:#06232f;}
.ed .sbtn.cancel{background:var(--panel2); color:var(--dim); border:1px solid var(--line);}
/* 설정 메뉴 */
.hrow{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; position:relative;}
.hrow h1{margin-bottom:0;}
#gear{width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--dim); font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center; user-select:none;}
#gear:hover{color:var(--tx); border-color:var(--acc);}
#menu{display:none; position:absolute; top:40px; right:0; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:6px; min-width:170px; box-shadow:0 6px 20px rgba(0,0,0,.5); z-index:20;}
#menu.show{display:block;}
#menu .mi{padding:9px 12px; border-radius:7px; color:var(--tx); font-size:13.5px; cursor:pointer; white-space:nowrap;}
#menu .mi:hover{background:var(--panel);}
#menu .mi.danger:hover{color:var(--del);}
/* 모달 */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:30; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; width:100%; max-width:420px; max-height:80vh; overflow:auto;}
.modal h2{font-size:15px; color:var(--acc); margin-bottom:10px;}
.crow{display:flex; align-items:center; gap:8px; padding:7px 4px; border-bottom:1px solid var(--line); font-size:14px;}
.crow .cname{flex:1;}
.crow .ccnt{color:var(--dim); font-size:12px;}
.crow .cbtn{padding:3px 9px; border-radius:6px; border:1px solid var(--line); background:var(--panel2); color:var(--dim); font-size:12px; cursor:pointer;}
.crow .cbtn:hover{color:var(--tx);}
.crow .cbtn.d:hover{color:var(--del); border-color:var(--del);}
.modal .mbtns{display:flex; gap:8px; margin-top:14px;}
.modal .mb{flex:1; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--tx); font-size:13.5px; cursor:pointer; text-align:center;}
.modal .mb:hover{border-color:var(--acc);}
/* 표시 켜기/끄기 */
body.h-imp .imp{display:none;}
body.h-mod .modtag{display:none;}
body.h-mod .card.edited{border-left:1px solid var(--line);}
body.h-cat .cat-tag{display:none;}
body.h-num .no{display:none;}
body.h-ph .ph{display:none;}
body.h-note .nt{display:none;}
.trow{display:flex; align-items:center; justify-content:space-between; padding:9px 4px; border-bottom:1px solid var(--line); font-size:14px; cursor:pointer; user-select:none;}
.trow .sw{width:38px; height:20px; border-radius:11px; background:var(--panel2); border:1px solid var(--line); position:relative; transition:.15s;}
.trow .sw::after{content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--dim); transition:.15s;}
.trow.on .sw{background:var(--acc); border-color:var(--acc);}
.trow.on .sw::after{left:20px; background:#06232f;}
/* 퀴즈 오버레이 */
#quizOv{position:fixed; inset:0; z-index:50; background:var(--bg); display:flex; flex-direction:column;}
#quizOv .qbar{display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); padding-top:calc(10px + env(safe-area-inset-top));}
#quizOv .qbar b{color:var(--acc); font-size:15px;}
#quizOv .qx{padding:7px 16px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--tx); cursor:pointer; font-size:13.5px;}
#quizOv iframe{flex:1; border:none; width:100%;}
/* 웹 연결 배너 */
.webbar{max-width:860px; margin:10px auto 0; padding:0 14px;}
.webbar a{display:block; text-align:center; padding:11px; border-radius:9px; background:var(--acc); color:#06232f; font-weight:bold; text-decoration:none; font-size:14px;}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1><span id="siteTitle">기능 구술 암기장</span> <small>총 <span id="tot"></span>문항 <span id="saved" style="color:var(--ok)"></span></small></h1>
    <div id="gear" onclick="toggleMenu(event)">⚙</div>
    <div id="menu">
      <div class="mi" onclick="toggleMenu();editTitle()">✏️ 제목 변경</div>
      <div class="mi" onclick="toggleMenu();openCatMgr()">🗂 카테고리 관리</div>
      <div class="mi" onclick="toggleMenu();playQuiz()">🎯 퀴즈 바로 풀기</div>
      <div class="mi" onclick="toggleMenu();makeQuiz()">📤 퀴즈 파일로 저장</div>
      <div class="mi" onclick="toggleMenu();setWebUrl()">🌐 웹 주소 연결</div>
      <div class="mi" onclick="toggleMenu();openShowMgr()">👁 표시 설정</div>
      <div class="mi" onclick="toggleMenu();sortByNum()">🔢 번호순 정렬</div>
      <div class="mi" onclick="toggleMenu();clearMods()">🧹 수정 표시 정리</div>
      <div class="mi" onclick="toggleMenu();saveAsHTML()">📄 HTML 파일로 저장 (데이터 내장)</div>
      <div class="mi" onclick="exportJSON();toggleMenu()">💾 내보내기 (JSON)</div>
      <div class="mi" onclick="document.getElementById('impFile').click();toggleMenu()">📂 가져오기</div>
      <div class="mi danger" onclick="toggleMenu();resetAll()">↺ 원본 복원</div>
    </div>
  </div>
  <input id="q" type="search" placeholder="검색 (예: MCB, 비상제동, 연장급전, ATC...)" autocomplete="off">
  <div class="chips" id="chips"></div>
  <div class="btns">
    <div class="btn" onclick="allOpen(true)">전체 펼치기</div>
    <div class="btn" onclick="allOpen(false)">전체 접기</div>
    <div class="btn" id="impBtn" onclick="toggleImp()">★ 중요만</div>
    <div class="btn" onclick="addCard()">＋ 문항 추가</div>
  </div>
  <input type="file" id="impFile" accept=".json" style="display:none" onchange="importJSON(this)">
  <div id="stat"></div>
</header>
<main id="list"></main>
<footer>카드 클릭 → 펼치기 → 하단 ✏️수정 · 수정본은 자동저장 · 파일 옮길 땐 ⚙→"HTML 파일로 저장" 사용</footer>

const KEY='gusul_amgijang_v1';
let DATA;
let META={title:"기능 구술 암기장", extraCats:[], show:{num:1, imp:1, mod:1, cat:1, ph:1, note:1}};
function safeLS(fn){ try{return fn();}catch(e){return null;} }
function load(){
  const jf=document.getElementById('jsfreeBar'); if(jf) jf.remove(); // JS 작동시 정적 배너는 동적 배너로 대체
  let ls=null, em=null;
  const raw=safeLS(()=>localStorage.getItem(KEY));
  if(raw){ try{ ls=JSON.parse(raw); }catch(e){} }
  if(Array.isArray(ls)) ls={data:ls, meta:{}, ts:0}; // 구버전 호환
  try{
    const e=JSON.parse(document.getElementById('embed').textContent);
    if(e && Array.isArray(e.data)) em=e;
  }catch(e){}
  // 둘 다 있으면 저장 시각(ts)이 최신인 쪽 사용
  let src=null;
  if(ls && em) src=(em.ts||0)>(ls.ts||0)?em:ls;
  else src=ls||em;
  if(src){
    DATA=src.data||[]; Object.assign(META, src.meta||{});
    document.getElementById('saved').textContent='· 수정본';
    if(src===em) persist(); // 내장 데이터로 시작하면 이 위치의 localStorage에도 심어둠
  } else {
    DATA=JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  applyTitle(); applyShow(); updateWebBar();
}
function persist(){
  const ok=safeLS(()=>{localStorage.setItem(KEY, JSON.stringify({data:DATA, meta:META, ts:Date.now()})); return true;});
  document.getElementById('saved').textContent = ok ? '· 수정본 저장됨' : '· 저장 불가(내보내기로 백업)';
}
function applyTitle(){
  document.getElementById('siteTitle').textContent=META.title;
  document.title=META.title;
}
function editTitle(){
  const t=prompt('사이트 제목 입력', META.title);
  if(t && t.trim()){ META.title=t.trim(); applyTitle(); persist(); }
}
function sortData(){
  DATA.sort((a,b)=>{
    const p=v=>String(v).startsWith("신")?1000+(parseInt(String(v).slice(1))||0):(parseFloat(v)||9999);
    return p(a.num)-p(b.num);
  });
}

const CIRC="①②③④⑤⑥⑦⑧⑨⑩⑪⑫";

const list=document.getElementById('list');
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function nl2br(s){return esc(s).replace(/\n/g,'<br>');}

// ===== 렌더 =====
function build(){
  list.innerHTML="";
  DATA.forEach((d,i)=>{
    const c=document.createElement('div');
    c.className='card'+(d.mod?' edited':''); c.dataset.i=i;
    if(editingIdx===i){ c.classList.add('open'); c.innerHTML=headHTML(d)+editorHTML(d); bindEditor(c,i); }
    else{
      let bd="";
      if(d.ph) bd+=`<div class="ph">현상: <span class="s">${esc(d.ph)}</span></div>`;
      bd+="<ol>"+d.items.map((it,j)=>`<li data-n="${CIRC[j]||(j+1)+'.'}" class="s">${esc(it)}</li>`).join("")+"</ol>";
      if(d.note) bd+=`<div class="nt s">${nl2br(d.note)}</div>`;
      bd+=`<div class="acts"><div class="act" onclick="moveCard(${i},-1);event.stopPropagation()">▲</div><div class="act" onclick="moveCard(${i},1);event.stopPropagation()">▼</div><div class="act" onclick="moveTo(${i});event.stopPropagation()">↕ 위치지정</div><div class="act" onclick="startEdit(${i});event.stopPropagation()">✏️ 수정</div><div class="act danger" onclick="delCard(${i});event.stopPropagation()">🗑 삭제</div></div>`;
      c.innerHTML=headHTML(d)+`<div class="bd">${bd}</div>`;
      c.querySelector('.hd').onclick=()=>c.classList.toggle('open');
    }
    list.appendChild(c);
  });
  document.getElementById('tot').textContent=DATA.length;
  filter();
}
function headHTML(d){
  return `<div class="hd"><span class="no">${esc(d.num)}.</span><span class="tt"><span class="s">${esc(d.title)}</span>${d.imp?'<span class="imp">★중요</span>':''}${d.mod?'<span class="modtag" style="color:var(--acc2);font-size:11px;margin-left:5px">(수정됨)</span>':''}</span><span class="cat-tag">${esc(d.cat)}</span></div>`;
}

    <div class="row">
      <div><label>번호</label><input type="text" class="e-num" value="${esc(d.num)}"></div>
      <div><label>카테고리</label><input type="text" class="e-cat" value="${esc(d.cat)}" list="catList"></div>

    <label>현상 (없으면 비워둠)</label><textarea class="e-ph" rows="2">${esc(d.ph||"")}</textarea>
    <label>항목 (한 줄 = ① 하나)</label><textarea class="e-items" rows="${Math.max(4,d.items.length+1)}">${esc(d.items.join("\n"))}</textarea>
    <label>비고 (없으면 비워둠)</label><textarea class="e-note" rows="3">${esc(d.note||"")}</textarea>
    <div class="save-row"><button class="sbtn save">✔ 저장</button><button class="sbtn cancel">✖ 취소</button></div>
  </div>`;

function bindEditor(card,i){
  card.querySelector('.sbtn.save').onclick=()=>{
    const g=cls=>card.querySelector(cls);
    const d=DATA[i];
    d.num=g('.e-num').value.trim()||d.num;
    d.cat=g('.e-cat').value.trim()||"기타";
    d.title=g('.e-title').value.trim()||d.title;
    d.imp=g('.e-imp').checked?1:0;
    const ph=g('.e-ph').value.trim(); ph?d.ph=ph:delete d.ph;
    d.items=g('.e-items').value.split("\n").map(s=>s.trim()).filter(Boolean);
    if(!d.items.length) d.items=["(내용 없음)"];
    const nt=g('.e-note').value.trim(); nt?d.note=nt:delete d.note;
    d.mod=1;
    editingIdx=null; persist(); rebuildChips(); build();
  };
  card.querySelector('.sbtn.cancel').onclick=()=>{
    if(DATA[i]._new) DATA.splice(i,1);
    editingIdx=null; build();
  };
}
function moveCard(i, dir){
  const j=i+dir;
  if(j<0 || j>=DATA.length) return;
  [DATA[i], DATA[j]]=[DATA[j], DATA[i]];
  persist(); build();
  const el=list.querySelector(`.card[data-i="${j}"]`);
  if(el){ el.classList.add('open'); el.scrollIntoView({block:'nearest', behavior:'smooth'}); }
}
function moveTo(i){
  const p=prompt(`이동할 위치 입력 (1 ~ ${DATA.length})\n현재: ${i+1}번째 · "${DATA[i].num}. ${DATA[i].title}"`, i+1);
  if(p===null) return;
  let n=parseInt(p);
  if(isNaN(n)){ alert('숫자만 입력'); return; }
  n=Math.max(1, Math.min(DATA.length, n))-1;
  if(n===i) return;
  const [item]=DATA.splice(i,1);
  DATA.splice(n,0,item);
  persist(); build();
  const el=list.querySelector(`.card[data-i="${n}"]`);
  if(el){ el.classList.add('open'); el.scrollIntoView({block:'center', behavior:'smooth'}); }
}
function startEdit(i){ editingIdx=i; build();
  const el=list.querySelector(`.card[data-i="${i}"]`); if(el) el.scrollIntoView({block:'nearest'});
}
function delCard(i){
  if(!confirm(`${DATA[i].num}. ${DATA[i].title}\n삭제할까?`)) return;
  DATA.splice(i,1); editingIdx=null; persist(); rebuildChips(); build();
}
function addCard(){
  DATA.unshift({num:"", cat:curCat==="전체"?"기타":curCat, title:"", items:[], _new:1});
  editingIdx=0; build(); window.scrollTo({top:0});
}

// ===== 파일 저장 헬퍼 (iOS는 공유 시트, 그 외는 다운로드) =====
const IS_IOS=/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
async function saveBlob(blob, filename){
  if(IS_IOS && navigator.canShare){
    try{
      const file=new File([blob], filename, {type:blob.type});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file]});
        return true;
      }
    }catch(e){ if(e.name==='AbortError') return false; /* 공유 실패시 아래 다운로드로 폴백 */ }
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click(); URL.revokeObjectURL(a.href);
  return true;
}

  const payload=JSON.stringify({data:DATA, meta:META, ts:Date.now()}).replace(/</g,'\\u003c');
  document.getElementById('embed').textContent=payload;
  // 웹 주소가 설정돼 있으면, JS가 차단된 환경(iOS 파일앱 미리보기 등)에서도
  // 탭 한 번으로 웹으로 갈 수 있게 정적 배너를 파일에 심는다 (JS가 돌면 자동 제거됨)
  const oldJf=document.getElementById('jsfreeBar'); if(oldJf) oldJf.remove();
  if(META.webUrl){
    const jf=document.createElement('div');
    jf.id='jsfreeBar';
    jf.innerHTML='<a href="'+esc(META.webUrl)+'" style="display:block;text-align:center;padding:13px;margin:10px 14px;border-radius:9px;background:#4fc3f7;color:#06232f;font-weight:bold;text-decoration:none;font-size:15px;font-family:sans-serif;">🌐 웹 버전으로 열기 (탭) →</a>';
    document.body.prepend(jf);
  }
  const src='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  const jf2=document.getElementById('jsfreeBar'); if(jf2) jf2.remove(); // 현재 화면에선 다시 제거
  const blob=new Blob([src],{type:'text/html'});
  saveBlob(blob, META.title+'.html').then(ok=>{
    if(ok && !IS_IOS) alert('현재 데이터가 통째로 내장된 HTML 파일이 저장됨.\n이 파일은 어디로 옮기거나 다른 컴·아이패드·폰에서 열어도 데이터 그대로임.');
  });
}

// ===== 내보내기/가져오기/초기화 =====
function exportJSON(){
  const blob=new Blob([JSON.stringify({data:DATA, meta:META},null,1)],{type:'application/json'});
  saveBlob(blob, META.title+'_데이터_'+new Date().toISOString().slice(0,10)+'.json');
}
function importJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const p=JSON.parse(r.result);
      let arr;
      if(Array.isArray(p)) arr=p;
      else { arr=p.data; if(p.meta) Object.assign(META, p.meta); }
      if(!Array.isArray(arr)||!arr[0].title) throw 0;
      DATA=arr; persist(); applyTitle(); editingIdx=null; rebuildChips(); build();
      alert('가져오기 완료: '+arr.length+'문항');
    }catch(e){ alert('파일 형식이 안 맞음 (내보내기로 만든 JSON만 가능)'); } };
  r.readAsText(f); inp.value='';
}
function resetAll(){
  if(!confirm('수정한 내용 전부 버리고 원본으로 복원할까?\n(필요하면 먼저 내보내기로 백업)')) return;
  safeLS(()=>localStorage.removeItem(KEY));
  META={title:"기능 구술 암기장", extraCats:[], show:{num:1, imp:1, mod:1, cat:1, ph:1, note:1}};
  load(); editingIdx=null; document.getElementById('saved').textContent=''; rebuildChips(); build();
}

// ===== 표시 켜기/끄기 =====
const SHOW_ITEMS=[
  ['num','문항 번호'],
  ['imp','★중요 뱃지'],
  ['mod','수정됨 표시 (주황 테두리)'],
  ['cat','카테고리 태그'],
  ['ph','현상 줄'],
  ['note','비고 (부가설명)']
];
function applyShow(){
  if(!META.show) META.show={num:1, imp:1, mod:1, cat:1, ph:1, note:1};
  SHOW_ITEMS.forEach(([k])=>{
    document.body.classList.toggle('h-'+k, !META.show[k]);
  });
}
function openShowMgr(){
  closeShowMgr();
  const ov=document.createElement('div'); ov.className='overlay'; ov.id='showOv';
  ov.onclick=e=>{ if(e.target===ov) closeShowMgr(); };
  const md=document.createElement('div'); md.className='modal';
  md.innerHTML='<h2>👁 표시 설정</h2><div id="showRows"></div><div class="mbtns"><div class="mb" id="showAll">전체 켜기</div><div class="mb" id="hideAll">전체 끄기</div><div class="mb" id="showClose">닫기</div></div>';
  ov.appendChild(md); document.body.appendChild(ov);
  const rows=md.querySelector('#showRows');
  function render(){
    rows.innerHTML="";
    SHOW_ITEMS.forEach(([k,label])=>{
      const r=document.createElement('div');
      r.className='trow'+(META.show[k]?' on':'');
      r.innerHTML='<span>'+label+'</span><span class="sw"></span>';
      r.onclick=()=>{ META.show[k]=META.show[k]?0:1; applyShow(); persist(); render(); };
      rows.appendChild(r);
    });
  }
  md.querySelector('#showAll').onclick=()=>{ SHOW_ITEMS.forEach(([k])=>META.show[k]=1); applyShow(); persist(); render(); };
  md.querySelector('#hideAll').onclick=()=>{ SHOW_ITEMS.forEach(([k])=>META.show[k]=0); applyShow(); persist(); render(); };
  md.querySelector('#showClose').onclick=closeShowMgr;
  render();
}
function closeShowMgr(){ const o=document.getElementById('showOv'); if(o) o.remove(); }

// ===== 번호순 정렬 (수동) =====
function sortByNum(){
  if(!confirm('현재 순서를 버리고 문항 번호순으로 재정렬할까?')) return;
  sortData(); persist(); build();
}

// ===== 수정 표시 정리 (최종본 확정) =====
function clearMods(){
  if(!confirm('모든 "수정됨" 표시를 지우고 최종본 상태로 확정할까?\n(데이터는 그대로, 표시만 사라짐)')) return;
  DATA.forEach(d=>delete d.mod);
  persist(); build();
}

// ===== 카테고리 관리 =====
function allCats(){ return [...new Set([...DATA.map(d=>d.cat), ...META.extraCats])]; }
function openCatMgr(){
  closeCatMgr();
  const ov=document.createElement('div'); ov.className='overlay'; ov.id='catOv';
  ov.onclick=e=>{ if(e.target===ov) closeCatMgr(); };
  const md=document.createElement('div'); md.className='modal';
  md.innerHTML='<h2>🗂 카테고리 관리</h2><div id="catRows"></div><div class="mbtns"><div class="mb" id="catAdd">＋ 새 카테고리</div><div class="mb" id="catClose">닫기</div></div>';
  ov.appendChild(md); document.body.appendChild(ov);
  md.querySelector('#catAdd').onclick=()=>{
    const n=prompt('새 카테고리 이름');
    if(!n||!n.trim()) return;
    const name=n.trim();
    if(allCats().includes(name)){ alert('이미 있는 카테고리'); return; }
    META.extraCats.push(name); persist(); rebuildChips(); renderCatRows();
  };
  md.querySelector('#catClose').onclick=closeCatMgr;
  renderCatRows();
}
function closeCatMgr(){ const o=document.getElementById('catOv'); if(o) o.remove(); }
function renderCatRows(){
  const box=document.getElementById('catRows'); if(!box) return;
  box.innerHTML="";
  allCats().forEach(cat=>{
    const cnt=DATA.filter(d=>d.cat===cat).length;
    const row=document.createElement('div'); row.className='crow';
    row.innerHTML=`<span class="cname">${esc(cat)}</span><span class="ccnt">${cnt}문항</span><span class="cbtn rn">이름변경</span><span class="cbtn d del">삭제</span>`;
    row.querySelector('.rn').onclick=()=>{
      const n=prompt('새 이름', cat);
      if(!n||!n.trim()||n.trim()===cat) return;
      const name=n.trim();
      if(allCats().includes(name)){ alert('이미 있는 이름'); return; }
      DATA.forEach(d=>{ if(d.cat===cat) d.cat=name; });
      META.extraCats=META.extraCats.map(c=>c===cat?name:c);
      if(curCat===cat) curCat=name;
      persist(); rebuildChips(); build(); renderCatRows();
    };
    row.querySelector('.del').onclick=()=>{
      const msg=cnt?`"${cat}" 삭제 → 소속 ${cnt}문항은 "기타"로 이동. 진행?`:`빈 카테고리 "${cat}" 삭제할까?`;
      if(!confirm(msg)) return;
      DATA.forEach(d=>{ if(d.cat===cat) d.cat="기타"; });
      META.extraCats=META.extraCats.filter(c=>c!==cat);
      if(curCat===cat) curCat="전체";
      persist(); rebuildChips(); build(); renderCatRows();
    };
    box.appendChild(row);
  });
  if(!box.children.length) box.innerHTML='<div style="color:var(--dim);font-size:13px;padding:10px 0">카테고리 없음</div>';
}

<body>
<header><h1 id="t"></h1></header>
<div id="app"></div>
<script>
const QD=__DATA__;
var CIRC='①②③④⑤⑥⑦⑧⑨⑩⑪⑫';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var cats=['전체'];
QD.data.forEach(function(d){ if(cats.indexOf(d.cat)<0) cats.push(d.cat); });
var selCat='전체', impOnly=false, cnt='전체';
var pool=[], idx=0, results=[];
var app=document.getElementById('app');
document.getElementById('t').textContent=QD.title+' — 주관식 퀴즈';
document.title=QD.title+' 퀴즈';

// ===== 키워드 추출/채점 =====
var STOP=['또는','다만','그리고','있는','있을','있고','하는','하고','한다','된다','되는','해당','다른','모든','후에','때문','대한','아닐','않는','않을','않음','이하','이상','미만','초과','경우','위해','따라'];
function stripP(t){
  t=t.replace(/(에게|에서|으로|까지|부터|하여|되어|은|는|이|가|을|를|의|와|과|로|에|도|만)$/,'');
  if(t.length>=3 && /[시됨함임]$/.test(t)) t=t.slice(0,-1); // 체결시→체결, 차단됨→차단 (현시·즉시 등 2글자는 유지)
  return t;
}
function keywords(q){
  var text=(q.ph?q.ph+' ':'')+q.items.join(' ')+(q.note?' '+q.note:'');
  var toks=text.split(/[^0-9A-Za-z가-힣]+/);
  var out=[], seen={};
  toks.forEach(function(t){
    if(t.length<2) return;
    t=stripP(t);
    if(t.length<2) return;
    if(STOP.indexOf(t)>=0) return;
    var k=t.toLowerCase();
    if(seen[k]) return;
    seen[k]=1; out.push(t);
  });
  return out;
}
function norm(s){ return String(s).toLowerCase().replace(/\\s+/g,''); }
function grade(q, userText){
  var kws=keywords(q), u=norm(userText);
  var hit=[], miss=[];
  kws.forEach(function(k){ (u.indexOf(norm(k))>=0?hit:miss).push(k); });
  var pct=kws.length?Math.round(hit.length/kws.length*100):0;
  return {pct:pct, hit:hit, miss:miss};
}
function judgeOf(pct){
  if(pct>=70) return {t:'정답', c:'var(--ok)'};
  if(pct>=40) return {t:'부분 정답', c:'var(--acc2)'};
  return {t:'오답', c:'var(--no)'};
}

function filterPool(){ return QD.data.filter(function(d){ return (selCat==='전체'||d.cat===selCat)&&(!impOnly||d.imp); }); }
function shuffleArr(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function startScreen(){
  var h='<div class="box"><div class="lbl">출제 범위</div><div class="chips" id="catCh">';
  cats.forEach(function(c){ h+='<div class="chip'+(c===selCat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</div>'; });
  h+='</div><label class="chk"><input type="checkbox" id="imp"'+(impOnly?' checked':'')+'> ★ 중요 문항만</label>';
  h+='<div class="lbl">문제 수</div><div class="chips" id="cntCh">';
  ['전체','10','20','30'].forEach(function(c){ h+='<div class="chip'+(c===cnt?' on':'')+'" data-n="'+c+'">'+c+'</div>'; });
  h+='</div><div class="avail" id="avail"></div>';
  h+='<div class="avail">답안을 직접 작성하면 모범답안의 핵심 키워드 포함 여부로 자동 채점 (70% 이상 정답)</div>';
  h+='<button class="big" id="go">시작 ▶</button></div>';
  app.innerHTML=h;
  function upd(){ document.getElementById('avail').textContent='해당 범위: '+filterPool().length+'문항 (무작위 출제)'; }
  app.querySelectorAll('#catCh .chip').forEach(function(el){ el.onclick=function(){ selCat=el.dataset.c; app.querySelectorAll('#catCh .chip').forEach(function(x){x.classList.toggle('on',x.dataset.c===selCat);}); upd(); }; });
  app.querySelectorAll('#cntCh .chip').forEach(function(el){ el.onclick=function(){ cnt=el.dataset.n; app.querySelectorAll('#cntCh .chip').forEach(function(x){x.classList.toggle('on',x.dataset.n===cnt);}); }; });
  document.getElementById('imp').onchange=function(){ impOnly=this.checked; upd(); };
  document.getElementById('go').onclick=begin;
  upd();
}
function begin(){
  var p=shuffleArr(filterPool().slice());
  if(!p.length){ alert('해당 범위에 문제가 없음'); return; }
  if(cnt!=='전체') p=p.slice(0,parseInt(cnt));
  pool=p; idx=0; results=[]; showQ();
}
function qHead(q){
  var h='<div class="prog"><span>'+(idx+1)+' / '+pool.length+'</span><span>평균 '+avgPct()+'%</span></div>';
  h+='<div class="qcard"><div class="qcat">'+esc(q.cat)+(q.imp?' · <span style="color:var(--star)">★중요</span>':'')+'</div>';
  h+='<div class="qtitle">Q. '+esc(q.num)+'. '+esc(q.title)+'</div>';
  return h;
}
function avgPct(){
  if(!results.length) return 0;
  var s=0; results.forEach(function(r){s+=r.pct;});
  return Math.round(s/results.length);
}
function showQ(){
  if(idx>=pool.length) return end();
  var q=pool[idx];
  var h=qHead(q);
  h+='<textarea id="ua" rows="7" placeholder="답안을 서술해봐 (조치 순서, 기기 명칭 등 핵심 키워드 위주로)"></textarea>';
  h+='<button class="big" id="sb">채점 ▶</button>';
  h+='</div><button class="quit" id="qt">그만하기</button>';
  app.innerHTML=h;
  var ta=document.getElementById('ua'); ta.focus();
  document.getElementById('sb').onclick=function(){ reveal(q, ta.value); };
  document.getElementById('qt').onclick=function(){ if(confirm('그만하고 처음으로?')) startScreen(); };
}
function reveal(q, userText){
  var g=grade(q, userText);
  results.push({q:q, pct:g.pct});
  var jd=judgeOf(g.pct);
  var h=qHead(q);
  h+='<div class="judge" style="color:'+jd.c+'"><span class="p">'+g.pct+'%</span>'+jd.t+' (키워드 '+g.hit.length+'/'+(g.hit.length+g.miss.length)+')</div>';
  h+='<div class="sec"><div class="st">내 답안</div><div class="mine">'+(userText.trim()?esc(userText):'(작성 안 함)')+'</div></div>';
  h+='<div class="sec"><div class="st">모범답안</div>';
  if(q.ph) h+='<div class="ph">현상: '+esc(q.ph)+'</div>';
  h+='<ol class="ans">';
  q.items.forEach(function(it,j){ h+='<li><b>'+(CIRC[j]||(j+1)+'.')+'</b>'+esc(it)+'</li>'; });
  h+='</ol>';
  if(q.note) h+='<div class="nt">'+esc(q.note).replace(/\\n/g,'<br>')+'</div>';
  h+='</div>';
  if(g.hit.length){ h+='<div class="sec"><div class="st">✔ 포함한 키워드</div><div>'; g.hit.forEach(function(k){h+='<span class="kw hit">'+esc(k)+'</span>';}); h+='</div></div>'; }
  if(g.miss.length){ h+='<div class="sec"><div class="st">✘ 빠진 키워드</div><div>'; g.miss.forEach(function(k){h+='<span class="kw miss">'+esc(k)+'</span>';}); h+='</div></div>'; }
  h+='<button class="big" id="nx">'+(idx+1>=pool.length?'결과 보기 ▶':'다음 문제 ▶')+'</button>';
  h+='</div><button class="quit" id="qt">그만하기</button>';
  app.innerHTML=h;
  document.getElementById('nx').onclick=function(){ idx++; showQ(); window.scrollTo(0,0); };
  document.getElementById('qt').onclick=function(){ if(confirm('그만하고 처음으로?')) startScreen(); };
}
function end(){
  var wrong=results.filter(function(r){return r.pct<70;});
  var h='<div class="box"><div class="res">평균 '+avgPct()+'%</div>';
  h+='<div class="pct">'+pool.length+'문항 중 정답(70%↑) '+(results.length-wrong.length)+'개</div>';
  h+='<div class="lbl">문항별 결과</div><ul class="wl">';
  results.forEach(function(r){
    var jd=judgeOf(r.pct);
    h+='<li><span>'+esc(r.q.num)+'. '+esc(r.q.title)+'</span><span class="sc" style="color:'+jd.c+'">'+r.pct+'%</span></li>';
  });
  h+='</ul>';
  if(wrong.length) h+='<button class="big" id="re">70% 미만만 다시 ▶</button>';
  else h+='<div class="perfect">전부 정답 👍</div>';
  h+='<button class="big sub" id="home">처음으로</button></div>';
  app.innerHTML=h;
  var re=document.getElementById('re');
  if(re) re.onclick=function(){ pool=shuffleArr(wrong.map(function(r){return r.q;})); idx=0; results=[]; showQ(); };
  document.getElementById('home').onclick=startScreen;
}
startScreen();
<\/script>
</body>
</html>`;
function quizHTML(){
  const snap={title:META.title, data:DATA.map(d=>({num:d.num, cat:d.cat, title:d.title, imp:d.imp||0, ph:d.ph||"", items:d.items, note:d.note||""}))};
  return QUIZ_TPL.replace('__DATA__', ()=>JSON.stringify(snap));
}
function makeQuiz(){
  const blob=new Blob([quizHTML()],{type:'text/html'});
  saveBlob(blob, META.title+'_퀴즈.html').then(ok=>{
    if(ok && !IS_IOS) alert('퀴즈 사이트 파일 생성됨 (현재 데이터 스냅샷 포함, 원본과 독립)');
  });
}
function playQuiz(){
  closeQuiz();
  const ov=document.createElement('div'); ov.id='quizOv';
  ov.innerHTML='<div class="qbar"><b>🎯 '+esc(META.title)+' 퀴즈</b><button class="qx" onclick="closeQuiz()">✕ 종료</button></div>';
  const fr=document.createElement('iframe');
  fr.srcdoc=quizHTML();
  ov.appendChild(fr);
  document.body.appendChild(ov);
  document.body.style.overflow='hidden';
}
function closeQuiz(){
  const o=document.getElementById('quizOv');
  if(o){ o.remove(); document.body.style.overflow=''; }
}
// ===== 웹 주소 연결 (파일로 열면 웹 버전으로 안내/이동) =====
function setWebUrl(){
  const u=prompt('웹 버전 주소 입력 (GitHub Pages 등)\n비우고 확인하면 연결 해제', META.webUrl||'https://');
  if(u===null) return;
  const url=u.trim();
  if(!url || url==='https://'){ delete META.webUrl; delete META.webAuto; persist(); updateWebBar(); alert('웹 연결 해제됨'); return; }
  if(!/^https?:\/\//.test(url)){ alert('http:// 또는 https:// 로 시작해야 함'); return; }
  META.webUrl=url;
  META.webAuto=confirm('파일로 열 때 자동으로 웹 버전으로 이동할까?\n(인터넷 연결돼 있을 때만 이동, 취소하면 배너 버튼만 표시)')?1:0;
  persist(); updateWebBar();
  alert('저장됨. 이 상태로 ⚙→"HTML 파일로 저장" 하면 그 파일에도 웹 연결이 내장됨');
}
function updateWebBar(){
  const old=document.getElementById('webbar'); if(old) old.remove();
  if(!META.webUrl) return;
  if(location.protocol!=='file:') return; // 이미 웹에서 열었으면 표시 안 함
  if(META.webAuto && navigator.onLine){ location.href=META.webUrl; return; }
  const bar=document.createElement('div'); bar.id='webbar'; bar.className='webbar';
  bar.innerHTML='<a href="'+esc(META.webUrl)+'">🌐 웹 버전으로 열기 →</a>';
  document.querySelector('header').after(bar);
}

// ===== 칩 =====
const chips=document.getElementById('chips');
function rebuildChips(){
  const cats=["전체", ...new Set([...DATA.map(d=>d.cat), ...META.extraCats])];
  if(!cats.includes(curCat)) curCat="전체";
  chips.innerHTML="";
  cats.forEach(cat=>{
    const el=document.createElement('div');
    el.className='chip'+(cat===curCat?' on':''); el.textContent=cat;
    el.onclick=()=>{curCat=cat; chips.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.textContent===cat)); filter();};
    chips.appendChild(el);
  });
  let dl=document.getElementById('catList');
  if(!dl){dl=document.createElement('datalist'); dl.id='catList'; document.body.appendChild(dl);}
  dl.innerHTML=cats.slice(1).map(c=>`<option value="${esc(c)}">`).join("");
}

// ===== 검색 + 필터 + 하이라이트 =====
const q=document.getElementById('q');
q.addEventListener('input',filter);
function toggleImp(){impOnly=!impOnly; const b=document.getElementById('impBtn'); b.style.color=impOnly?'var(--star)':''; filter();}
function allOpen(v){document.querySelectorAll('.card:not(.hide)').forEach(c=>c.classList.toggle('open',v));}
function filter(){
  const kw=q.value.trim().toLowerCase();
  let shown=0;
  document.querySelectorAll('.card').forEach(c=>{
    const d=DATA[c.dataset.i]; if(!d) return;
    if(+c.dataset.i===editingIdx){c.classList.remove('hide'); shown++; return;}
    c.querySelectorAll('.s').forEach(el=>{
      const raw=el.dataset.raw||(el.dataset.raw=el.innerHTML);
      if(!kw){el.innerHTML=raw; return;}
      el.innerHTML=raw.split(/(<[^>]+>)/g).map(seg=>seg.startsWith('<')?seg:
        seg.replace(new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<mark>${m}</mark>`)).join("");
    });
    const hay=(d.num+" "+d.title+" "+(d.ph||"")+" "+d.items.join(" ")+" "+(d.note||"")).toLowerCase();
    const ok=(!kw||hay.includes(kw)) && (curCat==="전체"||d.cat===curCat) && (!impOnly||d.imp);
    c.classList.toggle('hide',!ok);
    if(ok){shown++; if(kw) c.classList.add('open');}
    if(!kw && ok && curCat==="전체" && !impOnly) c.classList.remove('open');
  });
  document.getElementById('stat').textContent=`${shown}건 표시`+(kw?` · "${q.value}" 검색중`:"");
  let em=document.getElementById('emptyMsg');
  if(shown===0){ if(!em){em=document.createElement('div'); em.id='emptyMsg'; em.className='empty'; em.textContent='검색 결과 없음'; list.appendChild(em);} }
  else if(em){em.remove();}
}

// ===== 시작 =====
load(); sortData(); rebuildChips(); build();
</script>
